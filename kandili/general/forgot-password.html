<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kandili - Reset Password</title>
    <link rel="stylesheet" href="../../static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="auth-body">

    <div class="auth-card">
        <div class="auth-header">
            <h2>Reset Password</h2>
            <p>Enter your email to receive a password reset link</p>
        </div>
        
        <section class="login-card">
            <h3>Password Recovery</h3>
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="resetEmail">Email</label>
                    <input id="resetEmail" type="email" placeholder="name@school.edu" required />
                </div>

                <button type="submit" class="btn-primary btn-login" id="sendResetBtn">
                    <span>Send Reset Link</span>
                    <i class="fas fa-paper-plane" style="margin-left: 8px;"></i>
                </button>
            </form>
        </section>

        <div class="footer-text">
            <p>Remember your password? <a href="login.html">Back to Sign in</a></p>
        </div>
    </div>

    <!-- 1. Supabase Library from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. Supabase Client Connection -->
    <script src="../../static/js/supabaseClient.js"></script>

    <!-- 3. Forgot Password Logic -->
    <script src="../../static/js/forgotPasswordLogic.js"></script>
</body>
</html>
